{% extends 'base.html' %}
{% block title %}{{ 'Редактирование' if product else 'Новый товар' }}{% endblock %}
{% block content %}
<h1>{{ 'Редактировать товар' if product else 'Новый товар' }}</h1>

<form method="post" class="form-card">
    <label>Название *
        <input type="text" name="name" required value="{{ product.name if product else '' }}">
    </label>
    <label>Штрихкод
        <input type="text" name="barcode" value="{{ product.barcode or '' if product else '' }}">
    </label>
    <div class="grid-2">
        <label>Цена, ₽ *
            <input type="number" step="0.01" name="price" required
                   value="{{ product.price if product else '' }}">
        </label>
        <label>Остаток, шт *
            <input type="number" name="stock" required
                   value="{{ product.stock if product else '0' }}">
        </label>
    </div>
    <label>Категория
        <select name="category_id">
            <option value="">— без категории —</option>
            {% for c in categories %}
                <option value="{{ c.id }}"
                    {% if product and product.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
            {% endfor %}
        </select>
    </label>
    <label>Описание
        <textarea name="description" rows="3">{{ product.description or '' if product else '' }}</textarea>
    </label>

    <div class="form-actions">
        <button type="submit" class="btn-primary">Сохранить</button>
        <a href="{{ url_for('admin_products') }}" class="btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
