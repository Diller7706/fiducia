{% extends 'base.html' %}
{% block title %}Новое оприходование{% endblock %}
{% block content %}
<h1>Новое оприходование</h1>

<form method="post" class="form-card" style="max-width: 900px;">
    <div class="grid-2">
        <label>Дата *
            <input type="date" name="date" required value="{{ now_date }}">
        </label>
        <label>Поставщик *
            <input type="text" name="supplier" required placeholder="ООО «Косметик-Опт»">
        </label>
    </div>

    <label>Комментарий
        <input type="text" name="comment" placeholder="Накладная №1234">
    </label>

    <h2 style="margin-top: 20px;">Позиции</h2>

    <table class="table" id="itemsTable">
        <thead>
        <tr>
            <th>Товар</th>
            <th style="width: 110px;">Кол-во</th>
            <th style="width: 140px;">Цена закупки, ₽</th>
            <th style="width: 120px;">Сумма</th>
            <th style="width: 50px;"></th>
        </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
    </table>

    <button type="button" class="btn-secondary" onclick="addRow()" style="margin-top: 10px;">
        + Добавить позицию
    </button>

    <div style="margin-top: 20px; padding: 16px; background: var(--brand-light); border-radius: 8px;">
        <div style="font-size: 18px;">
            Итого: <b id="totalSum">0.00</b> ₽
        </div>
    </div>

    <div class="form-actions" style="margin-top: 20px;">
        <button type="submit" class="btn-primary">💾 Сохранить оприходование</button>
        <a href="{{ url_for('admin_supplies') }}" class="btn-secondary">Отмена</a>
    </div>
</form>

<script>
    const products = [
        {% for p in products %}
            { id: {{ p.id }}, name: "{{ p.name|replace('"', '\\"') }}", price: {{ p.wholesale_price or 0 }}, stock: {{ p.stock }} },
        {% endfor %}
    ];

    function addRow() {
        const tbody = document.getElementById('itemsBody');
        const tr = document.createElement('tr');

        const options = products.map(p =>
            `<option value="${p.id}" data-price="${p.price}">${p.name} (ост. ${p.stock})</option>`
        ).join('');

        tr.innerHTML = `
            <td>
                <select name="product_id[]" onchange="onProductChange(this)" required style="width:100%">
                    <option value="">— выберите товар —</option>
                    ${options}
                </select>
            </td>
            <td><input type="number" name="quantity[]" min="1" value="1" required onchange="recalc()" oninput="recalc()" style="width:100%"></td>
            <td><input type="number" step="0.01" name="purchase_price[]" min="0" value="0" required onchange="recalc()" oninput="recalc()" style="width:100%"></td>
            <td class="line-sum" style="font-weight:600; color: var(--brand);">0.00 ₽</td>
            <td><button type="button" class="btn-sm btn-danger" onclick="this.closest('tr').remove(); recalc();">✕</button></td>
        `;

        tbody.appendChild(tr);
    }

    function onProductChange(select) {
        const opt = select.options[select.selectedIndex];
        const price = opt.dataset.price;
        if (price) {
            const row = select.closest('tr');
            row.querySelector('input[name="purchase_price[]"]').value = parseFloat(price).toFixed(2);
        }
        recalc();
    }

    function recalc() {
        let total = 0;
        document.querySelectorAll('#itemsBody tr').forEach(tr => {
            const qty = parseFloat(tr.querySelector('input[name="quantity[]"]').value) || 0;
            const price = parseFloat(tr.querySelector('input[name="purchase_price[]"]').value) || 0;
            const sum = qty * price;
            tr.querySelector('.line-sum').textContent = sum.toFixed(2) + ' ₽';
            total += sum;
        });
        document.getElementById('totalSum').textContent = total.toFixed(2);
    }

    // Добавляем одну строку при открытии
    addRow();
</script>
{% endblock %}
