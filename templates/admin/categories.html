{% extends 'base.html' %}
{% block title %}Категории{% endblock %}
{% block content %}
<h1>Категории</h1>

<form method="post" class="inline-form">
    <input type="text" name="name" placeholder="Название категории" required>
    <button class="btn-primary">+ Добавить</button>
</form>

<table class="table">
    <thead><tr><th>ID</th><th>Название</th><th>Товаров</th><th></th></tr></thead>
    <tbody>
    {% for c in categories %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.products|length }}</td>
            <td>
                <form method="post" action="{{ url_for('admin_category_delete', cid=c.id) }}"
                      onsubmit="return confirm('Удалить категорию?')">
                    <button class="btn-sm btn-danger">🗑</button>
                </form>
            </td>
        </tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
